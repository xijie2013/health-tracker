<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#2d7d55"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="健康追踪"/>
<link rel="manifest" href="manifest.json"/>
<title>健康追踪</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#2d7d55;--gl:#e8f5ee;--gm:#4caf7d;
  --r:#d93025;--rl:#fdecea;
  --o:#e67e22;--ol:#fef3e2;
  --b:#1a73e8;--bl:#e8f0fe;
  --bg:#f0f4f1;--sur:#fff;--bdr:#dde5e0;
  --tx:#1e2d26;--txm:#6b8070;
  --sh:0 2px 8px rgba(0,0,0,.09);
  --rad:14px;--tabh:56px;--hdrh:52px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;max-width:600px;margin:0 auto;background:var(--bg)}
header{height:var(--hdrh);background:var(--g);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0}
header h1{color:#fff;font-size:17px;font-weight:600}
.hdr-btn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:18px;padding:5px 11px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.hdr-btn:active{background:rgba(255,255,255,.32)}
#sync-dot{width:7px;height:7px;border-radius:50%;background:#8bc34a;flex-shrink:0}
#sync-dot.syncing{background:#ffc107;animation:pulse 1s infinite}
#sync-dot.error{background:#f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#content{flex:1;overflow-y:auto;padding-bottom:calc(var(--tabh)+4px)}
nav{height:var(--tabh);background:var(--sur);display:flex;border-top:1px solid var(--bdr);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--txm);font-size:9px;cursor:pointer;transition:color .15s}
.tab-btn .icon{font-size:19px;line-height:1}
.tab-btn.active{color:var(--g)}
.tab-panel{display:none;padding:12px}
.tab-panel.active{display:block}

/* cards */
.card{background:var(--sur);border-radius:var(--rad);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.card-title{font-size:11px;font-weight:700;color:var(--txm);letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.cs{padding:10px 0;border-bottom:1px solid var(--bg)}
.cs:last-child{border-bottom:none;padding-bottom:0}
.cs:first-child{padding-top:0}

/* slider */
.sl-wrap{display:flex;align-items:center;gap:6px}
.sl-wrap input[type=range]{flex:1;accent-color:var(--g);cursor:pointer}
.sl-val{font-size:15px;font-weight:700;color:var(--g);min-width:38px;text-align:right;flex-shrink:0}
.sl-min{font-size:11px;color:var(--txm);flex-shrink:0}

/* 3-option */
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tb{padding:9px 4px;border:2px solid var(--bdr);border-radius:10px;background:#fff;font-size:13px;font-weight:600;color:var(--txm);cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.tb:active{transform:scale(.96)}
.tb.bad{border-color:var(--r);background:var(--rl);color:var(--r)}
.tb.ok{border-color:var(--o);background:var(--ol);color:var(--o)}
.tb.good{border-color:var(--g);background:var(--gl);color:var(--g)}

/* tags */
.tag-cloud{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:20px;border:2px solid var(--bdr);background:#fff;font-size:13px;font-weight:500;color:var(--txm);cursor:pointer;user-select:none;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff;border-color:transparent}
.chip-add{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:20px;border:2px dashed var(--bdr);background:transparent;font-size:13px;color:var(--txm);cursor:pointer;transition:all .15s}
.chip-add:active{background:var(--gl);border-color:var(--g);color:var(--g)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--g);color:#fff;width:100%}
.btn-s{background:var(--gl);color:var(--g)}
.btn-d{background:var(--rl);color:var(--r)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}

/* form */
label{display:block;font-size:13px;color:var(--txm);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;padding:9px 11px;border:1.5px solid var(--bdr);border-radius:10px;
  font-size:14px;background:#fff;color:var(--tx);outline:none;transition:border-color .2s;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
textarea{resize:vertical;min-height:60px}
.field{margin-bottom:12px}

/* supplement checkboxes */
.sl-list{display:flex;flex-direction:column;gap:7px}
.si{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);cursor:pointer;transition:background .12s;user-select:none}
.si.on{background:var(--gl)}
.sc{width:22px;height:22px;border-radius:6px;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.si.on .sc{background:var(--g);border-color:var(--g)}
.sc::after{content:'✓';color:#fff;font-size:12px;font-weight:700;display:none}
.si.on .sc::after{display:block}
.si-info{flex:1;min-width:0}
.si-name{font-size:14px;font-weight:500}
.si-dose{font-size:11px;color:var(--txm)}
.si-cat{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--bl);color:var(--b);flex-shrink:0}

/* log list */
.li{background:var(--sur);border-radius:var(--rad);padding:11px 13px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.li-date{font-size:14px;font-weight:600;margin-bottom:5px}
.li-date small{font-size:11px;color:var(--txm);font-weight:400;margin-left:5px}
.li-meta{display:flex;gap:6px;flex-wrap:wrap}
.lt{font-size:11px;padding:3px 8px;border-radius:7px}
.tg{background:var(--gl);color:var(--g)}
.to{background:var(--ol);color:var(--o)}
.tb2{background:var(--bl);color:var(--b)}

/* lab */
.lab-card{background:var(--sur);border-radius:var(--rad);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.lab-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.lab-dt{font-size:14px;font-weight:600}
.lab-lb{font-size:11px;color:var(--txm)}
.lab-tp{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--bl);color:var(--b)}
.lab-vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px}
.lv{background:var(--bg);border-radius:9px;padding:7px 10px}
.lv.out{background:var(--rl)}
.lv-n{font-size:10px;color:var(--txm);margin-bottom:2px}
.lv-v{font-size:15px;font-weight:700}
.lv.out .lv-v{color:var(--r)}
.lv-u{font-size:10px;color:var(--txm)}
.lv-r{font-size:9px;color:var(--txm);margin-top:2px}
.lab-note{font-size:12px;color:var(--txm);margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)}
.lmr{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.lmn{font-size:13px;font-weight:600;min-width:72px}

/* supp mgmt */
.smi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.smi:last-child{border-bottom:none}
.smi-info{flex:1;min-width:0}
.smi-name{font-size:13px;font-weight:500}
.smi-detail{font-size:11px;color:var(--txm);margin-top:2px}
.smi-act{display:flex;gap:5px;flex-shrink:0}

/* modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.modal{background:var(--sur);border-radius:20px 20px 0 0;padding:20px 16px 28px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;animation:su .22s ease}
@keyframes su{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.m-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.m-close{font-size:22px;color:var(--txm);background:none;border:none;cursor:pointer}

/* setup */
#setup{display:none;position:fixed;inset:0;background:var(--g);z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
#setup.open{display:flex}
.s-logo{font-size:56px;margin-bottom:12px}
.s-title{color:#fff;font-size:21px;font-weight:700;margin-bottom:6px}
.s-sub{color:rgba(255,255,255,.75);font-size:13px;margin-bottom:26px;text-align:center;line-height:1.6}
.s-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px}
.s-box label{color:var(--tx);font-size:13px;font-weight:500}
.s-hint{font-size:11px;color:var(--txm);margin-top:3px}

/* detail */
#det{display:none;position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto}
#det.open{display:block}
.det-hdr{position:sticky;top:0;background:var(--g);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:10}
.det-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.det-hdr h2{font-size:16px;font-weight:600;flex:1}
.det-body{padding:13px}
.tr{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bdr)}
.tr:last-child{border-bottom:none}
.tr-l{color:var(--txm)}
.tr-v{font-weight:600}

/* date banner */
.banner{background:linear-gradient(135deg,var(--g),var(--gm));border-radius:var(--rad);padding:12px 14px;margin-bottom:10px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.b-big{font-size:19px;font-weight:700}
.b-sub{font-size:11px;opacity:.8;margin-top:1px}
.b-st{font-size:12px;opacity:.9}

/* empty */
.empty{text-align:center;padding:36px 16px;color:var(--txm)}
.empty .ei{font-size:40px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}

/* toast */
#toast{position:fixed;bottom:calc(var(--tabh)+12px);left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:16px;font-size:13px;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* summary charts */
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{width:100%;height:auto;display:block}
.sum-section{margin-bottom:14px}
.period-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:12px;font-size:12px;font-weight:600;margin:3px}
.tag-stat{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.tag-stat:last-child{border-bottom:none}
.tag-bar-bg{flex:1;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.tag-bar-fill{height:100%;border-radius:3px;transition:width .4s}

#content::-webkit-scrollbar{width:3px}
#content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
</style>
</head>
<body>

<div id="setup">
  <div class="s-logo">🌿</div>
  <div class="s-title">健康追踪</div>
  <div class="s-sub">首次使用，请配置云端数据存储<br>数据保存在你的私有 GitHub Gist</div>
  <div class="s-box">
    <div class="field"><label>GitHub Gist ID</label>
      <input type="text" id="su-gid" placeholder="Gist URL 最后那串 hash"/>
      <div class="s-hint">gist.github.com/xijie2013/<b>这里</b></div>
    </div>
    <div class="field"><label>GitHub PAT Token</label>
      <input type="text" id="su-tok" placeholder="ghp_xxxxxxxxxxxx"/>
      <div class="s-hint">Settings → Developer Settings → Personal Access Tokens（勾 gist 权限）</div>
    </div>
    <button class="btn btn-p" onclick="saveSetup()">开始使用</button>
  </div>
</div>

<div id="app">
  <header>
    <h1>🌿 健康追踪</h1>
    <div style="display:flex;gap:7px;align-items:center">
      <button class="hdr-btn" onclick="syncNow()"><span id="sync-dot"></span><span id="sync-lb">同步</span></button>
      <button class="hdr-btn" onclick="openSettings()">⚙️</button>
    </div>
  </header>
  <div id="content">
    <div class="tab-panel active" id="p-today"><div id="today-c"></div></div>
    <div class="tab-panel" id="p-logs"><div id="logs-c"></div></div>
    <div class="tab-panel" id="p-sum"><div id="sum-c"></div></div>
    <div class="tab-panel" id="p-lab"><div id="lab-c"></div></div>
    <div class="tab-panel" id="p-supps"><div id="supps-c"></div></div>
  </div>
  <nav>
    <button class="tab-btn active" onclick="switchTab('today',this)"><span class="icon">☀️</span>今日</button>
    <button class="tab-btn" onclick="switchTab('logs',this)"><span class="icon">📋</span>日志</button>
    <button class="tab-btn" onclick="switchTab('sum',this)"><span class="icon">📊</span>总结</button>
    <button class="tab-btn" onclick="switchTab('lab',this)"><span class="icon">🧪</span>检测</button>
    <button class="tab-btn" onclick="switchTab('supps',this)"><span class="icon">💊</span>补剂</button>
  </nav>
</div>

<div class="mo" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="m-title"><span id="m-title"></span><button class="m-close" onclick="closeModal()">✕</button></div>
    <div id="m-body"></div>
  </div>
</div>

<div id="det">
  <div class="det-hdr">
    <button class="det-back" onclick="closeDet()">‹</button>
    <h2 id="det-title"></h2>
    <button class="btn btn-sm btn-s" onclick="editCurDet()">编辑</button>
  </div>
  <div class="det-body" id="det-body"></div>
</div>

<div id="toast"></div>

<script>
// ── constants ────────────────────────────────────────────────────────
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const SLQ={1:'很差',2:'一般',3:'非常不错'};
const SLC={1:'bad',2:'ok',3:'good'};
const ENL={1:'萎靡',2:'一般',3:'充沛'};
const ENC={1:'bad',2:'ok',3:'good'};
const DEF_TAGS=[{id:1,name:'经期',icon:'🔴',color:'#e91e63'},{id:2,name:'16:8 断食',icon:'⏰',color:'#1a73e8'},{id:3,name:'运动 10min',icon:'🏃',color:'#e67e22'}];

let GIST_ID=LS.get('ht_gid')||'';
let TOKEN=LS.get('ht_tok')||'';
let data=null;
let curDetId=null;
let slRanges=Object.assign({sleepMin:0,sleepMax:12,wtMin:45,wtMax:60},LS.get('ht_ranges')||{});

// ── setup / settings ────────────────────────────────────────────────
function saveSetup(){
  const g=document.getElementById('su-gid').value.trim();
  const t=document.getElementById('su-tok').value.trim();
  if(!g||!t){alert('请填写 Gist ID 和 Token');return}
  GIST_ID=g;TOKEN=t;LS.set('ht_gid',g);LS.set('ht_tok',t);
  document.getElementById('setup').classList.remove('open');init();
}
function openSettings(){
  openModal('设置',`
    <p style="font-size:11px;font-weight:700;color:var(--txm);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">☁️ 云端同步</p>
    <p style="font-size:12px;color:var(--txm);margin-bottom:10px">修改后立即生效并重新拉取数据</p>
    <div class="field"><label>Gist ID</label><input type="text" id="sg" value="${esc(GIST_ID)}"/></div>
    <div class="field"><label>PAT Token</label><input type="text" id="st" value="${esc(TOKEN)}"/>
      <div class="s-hint">如果 regenerate 了 token，在这里更新</div></div>
    <hr style="border:none;border-top:1px solid var(--bdr);margin:14px 0"/>
    <p style="font-size:11px;font-weight:700;color:var(--txm);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px">📏 滑块范围</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="field"><label>睡眠最小 (h)</label><input type="number" id="sr-smin" value="${slRanges.sleepMin}" min="0" max="11" step="0.5"/></div>
      <div class="field"><label>睡眠最大 (h)</label><input type="number" id="sr-smax" value="${slRanges.sleepMax}" min="1" max="24" step="0.5"/></div>
      <div class="field"><label>体重最小 (kg)</label><input type="number" id="sr-wmin" value="${slRanges.wtMin}" min="20" max="200" step="0.5"/></div>
      <div class="field"><label>体重最大 (kg)</label><input type="number" id="sr-wmax" value="${slRanges.wtMax}" min="20" max="300" step="0.5"/></div>
    </div>
    <button class="btn btn-p" onclick="applySettings()">保存并重新同步</button>`);
}
async function applySettings(){
  const g=document.getElementById('sg').value.trim();
  const t=document.getElementById('st').value.trim();
  if(!g||!t){toast('请填写完整');return}
  GIST_ID=g;TOKEN=t;LS.set('ht_gid',g);LS.set('ht_tok',t);
  const smin=parseFloat(document.getElementById('sr-smin').value)||0;
  const smax=parseFloat(document.getElementById('sr-smax').value)||12;
  const wmin=parseFloat(document.getElementById('sr-wmin').value)||45;
  const wmax=parseFloat(document.getElementById('sr-wmax').value)||60;
  if(smax<=smin||wmax<=wmin){toast('最大值必须大于最小值');return}
  slRanges={sleepMin:smin,sleepMax:smax,wtMin:wmin,wtMax:wmax};
  LS.set('ht_ranges',slRanges);
  closeModal();await fetchGist();renderAll();toast('✅ 设置已更新');
}

// ── gist api ─────────────────────────────────────────────────────────
async function fetchGist(){
  setSS('syncing');
  try{
    const r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{headers:{'Authorization':`token ${TOKEN}`,'Accept':'application/vnd.github+json'}});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const gist=await r.json();
    const c=gist.files['health-data.json']?.content;
    if(!c)throw new Error('health-data.json 不存在');
    data=JSON.parse(c);LS.set('ht_cache',data);setSS('ok');return true;
  }catch(e){
    setSS('error');
    const ca=LS.get('ht_cache');
    if(ca){data=ca;toast('⚠️ 离线模式');return true}
    toast('❌ '+e.message);return false;
  }
}
async function patchGist(){
  setSS('syncing');
  data.exportedAt=new Date().toISOString();
  try{
    const r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{method:'PATCH',
      headers:{'Authorization':`token ${TOKEN}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({files:{'health-data.json':{content:JSON.stringify(data,null,2)}}})});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    LS.set('ht_cache',data);setSS('ok');toast('✅ 已保存');return true;
  }catch(e){setSS('error');toast('❌ '+e.message);return false;}
}
function setSS(s){
  document.getElementById('sync-dot').className=s;
  document.getElementById('sync-lb').textContent=s==='syncing'?'同步中':s==='error'?'失败':'已同步';
}
async function syncNow(){await fetchGist();renderAll();}

// ── init ─────────────────────────────────────────────────────────────
async function init(){
  if(!GIST_ID||!TOKEN){document.getElementById('setup').classList.add('open');return}
  const ok=await fetchGist();
  if(!ok)return;
  if(!data)data=emptyData();
  ensureMeta();renderAll();
}
function emptyData(){
  return{version:1,exportedAt:new Date().toISOString(),nextLogId:1,nextLabId:1,nextTagId:10,
    tagDefs:[...DEF_TAGS],supplements:[],dailyLogs:[],labResults:[]};
}
function ensureMeta(){
  if(!data.tagDefs)data.tagDefs=[...DEF_TAGS];
  if(!data.nextTagId)data.nextTagId=Math.max(...data.tagDefs.map(t=>t.id),9)+1;
}
function renderAll(){renderToday();renderLogs();renderSummary();renderLab();renderSupps();}

// ── helpers ──────────────────────────────────────────────────────────
function today(){return new Date().toISOString().slice(0,10)}
function fmtD(d){
  const dt=new Date(d+'T00:00:00');
  return `${d.slice(5).replace('-','/')} 周${'日一二三四五六'[dt.getDay()]}`;
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function suppRate(log){
  if(!data.supplements.length)return null;
  return Math.round(data.supplements.filter(s=>log.supplements?.[s.id]).length/data.supplements.length*100);
}
function toast(msg,dur=2400){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),dur);
}
function switchTab(n,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+n).classList.add('active');btn.classList.add('active');
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('modal'))return;
  document.getElementById('modal').classList.remove('open');
}
function openModal(title,html){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-body').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}


// ── TAB 1: 今日 ──────────────────────────────────────────────────────
function renderToday(){
  const ts=today();
  let log=data.dailyLogs.find(l=>l.date===ts);
  if(!log){
    log={id:data.nextLogId++,date:ts,sleep:{hoursSlept:7,quality:0},energy:{level:0},weight:null,tags:[],supplements:{}};
    data.dailyLogs.push(log);
  }
  if(!log.tags)log.tags=[];if(log.weight===undefined)log.weight=null;

  const dt=new Date();
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const days=['周日','周一','周二','周三','周四','周五','周六'];
  const done=log.sleep.quality>0&&log.energy.level>0;

  const sqBtns=[1,2,3].map(v=>`<button class="tb ${log.sleep.quality===v?SLC[v]:''}" onclick="setTri('sq',${v},'sleep.quality')">${SLQ[v]}</button>`).join('');
  const enBtns=[1,2,3].map(v=>`<button class="tb ${log.energy.level===v?ENC[v]:''}" onclick="setTri('en',${v},'energy.level')">${ENL[v]}</button>`).join('');

  const wtMid=Math.round((slRanges.wtMin+slRanges.wtMax)/2*2)/2;
  const wVal=log.weight!==null?Math.max(slRanges.wtMin,Math.min(slRanges.wtMax,log.weight)):wtMid;
  const wDisp=log.weight!==null?log.weight+' kg':'— kg';

  const tagChips=data.tagDefs.map(t=>{
    const on=log.tags.includes(t.id);
    return `<span class="chip${on?' on':''}" style="${on?'background:'+t.color+';':''}" onclick="toggleTag(${t.id},this)">${t.icon} ${esc(t.name)}</span>`;
  }).join('');

  const suppRows=data.supplements.map(s=>{
    const ch=log.supplements?.[s.id];
    return `<div class="si${ch?' on':''}" onclick="toggleSupp(${s.id},this)">
      <div class="sc"></div><div class="si-info"><div class="si-name">${esc(s.name)}</div><div class="si-dose">${esc(s.dose)} ${esc(s.unit)}</div></div>
      <span class="si-cat">${esc(s.category)}</span></div>`;
  }).join('')||`<p style="color:var(--txm);font-size:13px">还没有补剂 → 去「补剂」标签添加</p>`;

  document.getElementById('today-c').innerHTML=`
    <div class="banner">
      <div><div class="b-big">${months[dt.getMonth()]} ${dt.getDate()}日</div>
        <div class="b-sub">${dt.getFullYear()} · ${days[dt.getDay()]}</div></div>
      <div>${done
        ?'<div class="b-st">已记录 ✓</div>'
        :'<button class="hdr-btn" onclick="saveToday()" style="background:rgba(255,255,255,.25);padding:7px 13px;font-size:13px;font-weight:600">💾 保存记录</button>'
      }</div>
    </div>
    <div class="card">
      <div class="cs">
        <div class="card-title"><span class="dot" style="background:var(--g)"></span>睡眠时长</div>
        <div class="sl-wrap">
          <span class="sl-min">${slRanges.sleepMin}h</span>
          <input id="sl-sleep" type="range" min="${slRanges.sleepMin}" max="${slRanges.sleepMax}" step="0.5" value="${Math.max(slRanges.sleepMin,Math.min(slRanges.sleepMax,log.sleep.hoursSlept))}"
            oninput="document.getElementById('slv').textContent=this.value+'h';setF('sleep.hoursSlept',parseFloat(this.value))"/>
          <span class="sl-val" id="slv">${log.sleep.hoursSlept}h</span>
        </div>
        <div style="text-align:right;font-size:10px;color:var(--txm);margin-top:1px;padding-right:46px">${slRanges.sleepMax}h</div>
      </div>
      <div class="cs">
        <div class="card-title"><span class="dot" style="background:var(--g)"></span>睡眠质量</div>
        <div class="tri" id="sq">${sqBtns}</div>
      </div>
      <div class="cs">
        <div class="card-title"><span class="dot" style="background:var(--o)"></span>今日精力</div>
        <div class="tri" id="en">${enBtns}</div>
      </div>
      <div class="cs">
        <div class="card-title"><span class="dot" style="background:#9c27b0"></span>体重</div>
        <div class="sl-wrap">
          <span class="sl-min">${slRanges.wtMin}</span>
          <input id="sl-wt" type="range" min="${slRanges.wtMin}" max="${slRanges.wtMax}" step="0.5" value="${wVal}"
            style="${log.weight===null?'opacity:.35':''}"
            oninput="document.getElementById('wtv').textContent=this.value+' kg';setF('weight',parseFloat(this.value));this.style.opacity='1'"/>
          <span class="sl-val" id="wtv">${wDisp}</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:2px;padding-right:46px">
          <span style="font-size:10px;color:transparent">.</span>
          <span style="font-size:10px;color:var(--txm)">${slRanges.wtMax} kg</span>
        </div>
        <button class="btn btn-sm btn-s" style="margin-top:5px;font-size:11px" onclick="clearWt()">清除体重</button>
      </div>
      <div class="cs">
        <div class="card-title"><span class="dot" style="background:var(--b)"></span>今日标签</div>
        <div class="tag-cloud" id="tag-cloud">
          ${tagChips}
          <span class="chip-add" onclick="openAddTag()">＋ 新增</span>
        </div>
      </div>
    </div>
    ${data.supplements.length?`<div class="card">
      <div class="card-title"><span class="dot" style="background:var(--b)"></span>今日补剂</div>
      <div class="sl-list">${suppRows}</div></div>`
    :`<div class="card"><div class="sl-list">${suppRows}</div></div>`}`;
}

function setTri(gId,val,field){
  const g=document.getElementById(gId);if(!g)return;
  const isE=field.startsWith('energy');const cls=isE?ENC:SLC;
  g.querySelectorAll('.tb').forEach((b,i)=>{b.className='tb'+(i+1===val?' '+cls[i+1]:'')});
  setF(field,val);
}
function setF(field,val){
  const log=data.dailyLogs.find(l=>l.date===today());if(!log)return;
  const p=field.split('.');if(p.length===2)log[p[0]][p[1]]=val;else log[field]=val;
}
function clearWt(){
  setF('weight',null);
  const sl=document.getElementById('sl-wt');if(sl)sl.style.opacity='.35';
  document.getElementById('wtv').textContent='— kg';
}
function toggleTag(id,el){
  const log=data.dailyLogs.find(l=>l.date===today());if(!log)return;
  if(!log.tags)log.tags=[];
  const i=log.tags.indexOf(id);
  if(i>=0)log.tags.splice(i,1);else log.tags.push(id);
  const t=data.tagDefs.find(x=>x.id===id);if(!t)return;
  const on=log.tags.includes(id);
  el.className='chip'+(on?' on':'');
  el.style.background=on?t.color:'';
}
function toggleSupp(id,el){
  const log=data.dailyLogs.find(l=>l.date===today());if(!log)return;
  if(!log.supplements)log.supplements={};
  log.supplements[id]=!log.supplements[id];
  el.classList.toggle('on',log.supplements[id]);
}
async function saveToday(){
  const log=data.dailyLogs.find(l=>l.date===today());
  if(log&&(log.sleep.quality===0||log.energy.level===0)){toast('请选择睡眠质量和精力状态');return}
  await patchGist();renderToday();
}

// add custom tag
function openAddTag(){
  openModal('新增自定义标签',`
    <div class="field"><label>标签名称</label>
      <input type="text" id="nt-name" placeholder="冥想、高压日、头痛…" maxlength="12"/></div>
    <div class="field"><label>图标（粘贴一个 emoji）</label>
      <input type="text" id="nt-icon" placeholder="🌟" maxlength="4"/></div>
    <div class="field"><label>颜色</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="cp">
        ${['#2d7d55','#1a73e8','#e67e22','#e91e63','#9c27b0','#795548','#607d8b','#f44336'].map((c,i)=>
          `<div style="width:30px;height:30px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${i===0?'#fff':'transparent'}"
            onclick="pickC('${c}',this)" data-c="${c}"></div>`).join('')}
      </div><input type="hidden" id="nt-color" value="#2d7d55"/></div>
    <button class="btn btn-p" onclick="submitTag()">添加</button>`);
}
function pickC(c,el){
  document.querySelectorAll('#cp div').forEach(d=>d.style.borderColor='transparent');
  el.style.borderColor='#fff';document.getElementById('nt-color').value=c;
}
function submitTag(){
  const name=document.getElementById('nt-name').value.trim();
  if(!name){toast('请填写名称');return}
  const t={id:data.nextTagId++,name,icon:document.getElementById('nt-icon').value.trim()||'🏷️',color:document.getElementById('nt-color').value||'#607d8b'};
  data.tagDefs.push(t);
  const log=data.dailyLogs.find(l=>l.date===today());
  if(log){if(!log.tags)log.tags=[];log.tags.push(t.id)}
  closeModal();renderToday();
}

// ── TAB 2: 日志 ──────────────────────────────────────────────────────
function renderLogs(){
  const sorted=[...data.dailyLogs].sort((a,b)=>b.date.localeCompare(a.date));
  const addBtn=`<button class="btn btn-s" style="width:100%;margin-bottom:11px" onclick="openAddPastLog()">＋ 添加历史日志</button>`;
  if(!sorted.length){
    document.getElementById('logs-c').innerHTML=addBtn+`<div class="empty"><div class="ei">📋</div><p>还没有日志<br>在「今日」打卡后会出现在这里</p></div>`;return;
  }
  const rows=sorted.map(log=>{
    const sq=log.sleep.quality,en=log.energy.level;
    const rate=suppRate(log);
    const wtag=log.weight?`<span class="lt" style="background:#f3e5f5;color:#7b1fa2">⚖️ ${log.weight}kg</span>`:'';
    const ttags=(log.tags||[]).map(tid=>{const t=data.tagDefs.find(x=>x.id===tid);return t?`<span class="lt" style="background:${t.color}22;color:${t.color}">${t.icon} ${esc(t.name)}</span>`:''}).join('');
    return `<div class="li" onclick="openDet(${log.id})">
      <div class="li-date">${fmtD(log.date)}<small>${log.date}</small></div>
      <div class="li-meta">
        <span class="lt tg">🌙 ${log.sleep.hoursSlept}h · ${sq?SLQ[sq]:'—'}</span>
        <span class="lt to">⚡ ${en?ENL[en]:'—'}</span>
        ${rate!==null?`<span class="lt tb2">💊 ${rate}%</span>`:''}
        ${wtag}${ttags}
      </div></div>`;
  }).join('');
  document.getElementById('logs-c').innerHTML=addBtn+rows;
}

// add past log
function openAddPastLog(){
  const yd=new Date();yd.setDate(yd.getDate()-1);
  const def=yd.toISOString().slice(0,10);
  const sqBtns=[1,2,3].map(v=>`<button class="tb" id="plsq${v}" onclick="setPLTri('pl-sq',${v},'sq')">${SLQ[v]}</button>`).join('');
  const enBtns=[1,2,3].map(v=>`<button class="tb" id="plen${v}" onclick="setPLTri('pl-en',${v},'en')">${ENL[v]}</button>`).join('');
  const tagChips=data.tagDefs.map(t=>`<span class="chip" data-tid="${t.id}" onclick="togglePLTag(${t.id},this)">${t.icon} ${esc(t.name)}</span>`).join('');
  const suppRows=data.supplements.map(s=>`<div class="si" data-sid="${s.id}" onclick="this.classList.toggle('on')">
    <div class="sc"></div><div class="si-info"><div class="si-name">${esc(s.name)}</div><div class="si-dose">${esc(s.dose)}</div></div></div>`).join('');

  openModal('添加历史日志',`
    <div class="field"><label>日期</label>
      <input type="date" id="pl-date" value="${def}" max="${today()}"/></div>
    <div class="field"><label>睡眠时长</label>
      <div class="sl-wrap">
        <span class="sl-min">${slRanges.sleepMin}h</span>
        <input id="sl-pl" type="range" min="${slRanges.sleepMin}" max="${slRanges.sleepMax}" step="0.5" value="7"
          oninput="document.getElementById('pl-slv').textContent=this.value+'h'"/>
        <span class="sl-val" id="pl-slv">7h</span>
      </div>
      <div style="text-align:right;font-size:10px;color:var(--txm);padding-right:46px">${slRanges.sleepMax}h</div></div>
    <div class="field"><label>睡眠质量</label><div class="tri" id="pl-sq">${sqBtns}</div></div>
    <div class="field"><label>精力</label><div class="tri" id="pl-en">${enBtns}</div></div>
    <div class="field"><label>体重（可选）</label>
      <input type="number" id="pl-wt" step="0.5" min="${slRanges.wtMin}" max="${slRanges.wtMax}" placeholder="留空则不记录"/></div>
    ${tagChips?`<div class="field"><label>标签</label><div class="tag-cloud">${tagChips}</div></div>`:''}
    ${suppRows?`<div class="field"><label>补剂</label><div class="sl-list">${suppRows}</div></div>`:''}
    <button class="btn btn-p" onclick="submitPastLog()">保存历史日志</button>`);
}

let _plSQ=0,_plEN=0,_plTags=[];
function setPLTri(gId,val,which){
  const g=document.getElementById(gId);if(!g)return;
  const cls=which==='en'?ENC:SLC;
  g.querySelectorAll('.tb').forEach((b,i)=>{b.className='tb'+(i+1===val?' '+cls[i+1]:'')});
  if(which==='sq')_plSQ=val;else _plEN=val;
}
function togglePLTag(id,el){
  const i=_plTags.indexOf(id);
  if(i>=0){_plTags.splice(i,1);el.className='chip';el.style.background=''}
  else{_plTags.push(id);const t=data.tagDefs.find(x=>x.id===id);el.className='chip on';el.style.background=t?t.color:''}
}
async function submitPastLog(){
  _plSQ=0;_plEN=0;_plTags=[];
  const sq=parseInt(document.querySelector('#pl-sq .tb.bad,#pl-sq .tb.ok,#pl-sq .tb.good')?.dataset?.val||0);
  // re-read from class
  let sq2=0,en2=0;
  document.querySelectorAll('#pl-sq .tb').forEach((b,i)=>{if(b.classList.contains('bad')||b.classList.contains('ok')||b.classList.contains('good'))sq2=i+1});
  document.querySelectorAll('#pl-en .tb').forEach((b,i)=>{if(b.classList.contains('bad')||b.classList.contains('ok')||b.classList.contains('good'))en2=i+1});
  const tags=[...document.querySelectorAll('#m-body .chip.on[data-tid]')].map(el=>parseInt(el.dataset.tid));
  const supps={};
  document.querySelectorAll('#m-body .si.on[data-sid]').forEach(el=>supps[parseInt(el.dataset.sid)]=true);
  const dateVal=document.getElementById('pl-date').value;
  if(!dateVal){toast('请选择日期');return}
  if(data.dailyLogs.find(l=>l.date===dateVal)){toast('该日期已有记录，请从日志列表编辑');return}
  const wtStr=document.getElementById('pl-wt').value;
  const log={id:data.nextLogId++,date:dateVal,
    sleep:{hoursSlept:parseFloat(document.getElementById('sl-pl').value),quality:sq2},
    energy:{level:en2},weight:wtStr?parseFloat(wtStr):null,tags,supplements:supps};
  data.dailyLogs.push(log);
  await patchGist();closeModal();renderLogs();renderToday();
}

      <div class="card-title"><span class="dot" style="background:var(--o)"></span>精力</div>

function closeDet(){document.getElementById('det').classList.remove('open');curDetId=null;}
function editCurDet(){if(!curDetId)return;const log=data.dailyLogs.find(l=>l.id===curDetId);if(!log)return;closeDet();openEditLog(log);}

  }).join('');

          oninput="document.getElementById('el-slv').textContent=this.value+'h'"/>
        <span class="sl-val" id="el-slv">${log.sleep.hoursSlept}h</span>
      </div>
      <div style="text-align:right;font-size:10px;color:var(--txm);padding-right:46px">${slRanges.sleepMax}h</div></div>
    <div class="field"><label>睡眠质量</label><div class="tri" id="esq">${sqBtns}</div></div>
    <div class="field"><label>精力</label><div class="tri" id="een">${enBtns}</div></div>
    <div class="field"><label>体重（kg）</label>
      <input type="number" id="el-wt" step="0.5" min="${slRanges.wtMin}" max="${slRanges.wtMax}" value="${log.weight||''}" placeholder="留空则不记录"/></div>

    <button class="btn btn-p" onclick="saveEditLog(${log.id})">保存修改</button>`);

function setELTri(gId,val,which){
  const g=document.getElementById(gId);if(!g)return;
  const cls=which==='en'?ENC:SLC;
  g.querySelectorAll('.tb').forEach((b,i)=>{b.className='tb'+(i+1===val?' '+cls[i+1]:'')});
}
function toggleELTag(id,el){
  const t=data.tagDefs.find(x=>x.id===id);
  const on=el.classList.toggle('on');
  el.style.background=on&&t?t.color:'';
}
async function saveEditLog(id){
  const log=data.dailyLogs.find(l=>l.id===id);if(!log)return;
  let sq=0,en=0;
  document.querySelectorAll('#esq .tb').forEach((b,i)=>{if(b.classList.contains('bad')||b.classList.contains('ok')||b.classList.contains('good'))sq=i+1});
  document.querySelectorAll('#een .tb').forEach((b,i)=>{if(b.classList.contains('bad')||b.classList.contains('ok')||b.classList.contains('good'))en=i+1});
  log.sleep.hoursSlept=parseFloat(document.getElementById('el-sl').value);
  log.sleep.quality=sq;log.energy.level=en;
  const wtStr=document.getElementById('el-wt').value;
  log.weight=wtStr?parseFloat(wtStr):null;
  log.tags=[...document.querySelectorAll('#m-body .chip.on[data-tid]')].map(el=>parseInt(el.dataset.tid));
  const supps={};
  document.querySelectorAll('#m-body .si.on[data-sid]').forEach(el=>supps[parseInt(el.dataset.sid)]=true);
  log.supplements=supps;
  await patchGist();closeModal();renderLogs();renderToday();
}
async function delLog(id){
  if(!confirm('确认删除这条日志？'))return;
  data.dailyLogs=data.dailyLogs.filter(l=>l.id!==id);
  await patchGist();closeDet();renderLogs();renderToday();
}

// ── TAB 3: 总结 ──────────────────────────────────────────────────────
function renderSummary(){
  const logs=[...data.dailyLogs].sort((a,b)=>a.date.localeCompare(b.date));
  if(logs.length<2){
    document.getElementById('sum-c').innerHTML=`<div class="empty"><div class="ei">📊</div><p>至少需要 2 天数据<br>才能生成趋势图</p></div>`;return;
  }

  // Build date range: last 14 days
  const last14=[];
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);last14.push(d.toISOString().slice(0,10));}
  const logMap=Object.fromEntries(logs.map(l=>[l.date,l]));
  const series14=last14.map(d=>logMap[d]||null);
  const xLb14=last14.map(d=>d.slice(5).replace('-','/'));

  // Sleep hours chart
  const sleepH=series14.map(l=>l?{y:l.sleep.hoursSlept}:{y:null});
  const sleepQ=series14.map(l=>l&&l.sleep.quality?{y:l.sleep.quality}:{y:null});
  // Energy chart
  const energySeries=series14.map(l=>l&&l.energy.level?{y:l.energy.level}:{y:null});
  // Weight chart (use all logs with weight)
  const wtLogs=logs.filter(l=>l.weight!==null&&l.weight!==undefined);

  // Period prediction
  const periodTag=data.tagDefs.find(t=>t.name==='经期')||data.tagDefs.find(t=>t.id===1);
  const periodInfo=periodTag?analyzePeriod(periodTag.id):null;

  // Tag stats (last 30 days)
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
  const cutStr=cutoff.toISOString().slice(0,10);
  const recentLogs=logs.filter(l=>l.date>=cutStr);
  const tagCounts={};
  recentLogs.forEach(l=>(l.tags||[]).forEach(tid=>{tagCounts[tid]=(tagCounts[tid]||0)+1;}));
  const maxCount=Math.max(...Object.values(tagCounts),1);

  document.getElementById('sum-c').innerHTML=`
    <div class="card sum-section">
      <div class="card-title"><span class="dot" style="background:var(--g)"></span>睡眠时长（近 14 天）</div>
      <div class="chart-wrap">${lineChart(sleepH,xLb14,{minY:0,maxY:12,yTicks:[0,4,8,12],color:'#2d7d55',fmtY:v=>v+'h'})}</div>
    </div>
    <div class="card sum-section">
      <div class="card-title"><span class="dot" style="background:#9c27b0"></span>睡眠质量（近 14 天）</div>
      <div class="chart-wrap">${barChart(sleepQ,xLb14,{colors:{1:'#d93025',2:'#e67e22',3:'#2d7d55'},labels:{1:'很差',2:'一般',3:'不错'},maxY:3})}</div>
    </div>
    <div class="card sum-section">
      <div class="card-title"><span class="dot" style="background:var(--o)"></span>精力（近 14 天）</div>
      <div class="chart-wrap">${barChart(energySeries,xLb14,{colors:{1:'#d93025',2:'#e67e22',3:'#2d7d55'},labels:{1:'萎靡',2:'一般',3:'充沛'},maxY:3})}</div>
    </div>
    ${wtLogs.length>=2?`<div class="card sum-section">
      <div class="card-title"><span class="dot" style="background:#9c27b0"></span>体重趋势</div>
      <div class="chart-wrap">${lineChart(wtLogs.map(l=>({y:l.weight})),wtLogs.map(l=>l.date.slice(5).replace('-','/')),
        {minY:Math.floor(Math.min(...wtLogs.map(l=>l.weight))-1),maxY:Math.ceil(Math.max(...wtLogs.map(l=>l.weight))+1),
        yTicks:genYTicks(Math.floor(Math.min(...wtLogs.map(l=>l.weight))-1),Math.ceil(Math.max(...wtLogs.map(l=>l.weight))+1)),
        color:'#9c27b0',fmtY:v=>v+'kg'})}</div></div>`:''}
    ${periodInfo?`<div class="card sum-section">
      <div class="card-title"><span class="dot" style="background:#e91e63"></span>经期分析</div>
      ${renderPeriodInfo(periodInfo)}</div>`:''}
    ${Object.keys(tagCounts).length?`<div class="card sum-section">
      <div class="card-title"><span class="dot" style="background:var(--b)"></span>标签统计（近 30 天）</div>
      ${renderTagStats(tagCounts,maxCount)}</div>`:''}
  `;
}

function genYTicks(min,max){
  const range=max-min;const step=range<=4?1:range<=8?2:5;
  const ticks=[];for(let v=Math.ceil(min/step)*step;v<=max;v+=step)ticks.push(v);return ticks;
}

// SVG line chart
function lineChart(series,xLbs,{minY,maxY,yTicks,color,fmtY}){
  const n=series.length;if(!n)return '<p style="color:var(--txm);text-align:center;padding:20px;font-size:13px">数据不足</p>';
  const VW=340,VH=130,PL=36,PR=8,PT=10,PB=26;
  const W=VW-PL-PR,H=VH-PT-PB;
  const sx=i=>PL+(n>1?i/(n-1):0.5)*W;
  const sy=v=>PT+H-(v-minY)/(maxY-minY)*H;
  const grid=yTicks.map(t=>`<line x1="${PL}" y1="${sy(t).toFixed(1)}" x2="${VW-PR}" y2="${sy(t).toFixed(1)}" stroke="#eee" stroke-width="1"/>
    <text x="${PL-4}" y="${(sy(t)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#aaa">${fmtY?fmtY(t):t}</text>`).join('');
  const step=Math.max(1,Math.ceil(n/7));
  const xlb=xLbs.map((lb,i)=>i%step===0||i===n-1?`<text x="${sx(i).toFixed(1)}" y="${VH-2}" text-anchor="middle" font-size="8" fill="#aaa">${lb}</text>`:'').join('');
  let d='';let inp=false;
  series.forEach((s,i)=>{if(s.y===null||s.y===undefined){inp=false;return}
    const x=sx(i).toFixed(1),y=sy(s.y).toFixed(1);d+=inp?`L${x} ${y}`:`M${x} ${y}`;inp=true;});
  const dots=series.map((s,i)=>s.y!==null&&s.y!==undefined?`<circle cx="${sx(i).toFixed(1)}" cy="${sy(s.y).toFixed(1)}" r="3" fill="${color}"/>`:'').join('');
  return `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;height:auto">
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+H}" stroke="#ddd" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+H}" x2="${VW-PR}" y2="${PT+H}" stroke="#ddd" stroke-width="1"/>
    ${grid}${xlb}
    ${d?`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${dots}</svg>`;
}

// SVG bar chart
function barChart(series,xLbs,{colors,labels,maxY}){
  const n=series.length;if(!n)return '';
  const VW=340,VH=100,PL=8,PR=8,PT=8,PB=26;
  const W=VW-PL-PR,H=VH-PT-PB;
  const bw=Math.max(2,(W/n)-2);
  const cx=i=>PL+(i+0.5)*(W/n);
  const step=Math.max(1,Math.ceil(n/7));
  const xlb=xLbs.map((lb,i)=>i%step===0||i===n-1?`<text x="${cx(i).toFixed(1)}" y="${VH-2}" text-anchor="middle" font-size="8" fill="#aaa">${lb}</text>`:'').join('');
  const bars=series.map((s,i)=>{
    if(!s.y)return '';
    const bh=(s.y/maxY)*H;const c=colors[s.y]||'#aaa';
    return `<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${(PT+H-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${c}" opacity=".85"/>`;
  }).join('');
  // legend
  const legend=Object.entries(labels).map(([v,lb])=>`<tspan fill="${colors[v]||'#aaa'}">■${lb} </tspan>`).join('');
  return `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;height:auto">
    ${xlb}${bars}
    <text x="${PL}" y="${PT+6}" font-size="8">${legend}</text></svg>`;
}

// Period analysis
function analyzePeriod(tagId){
  const pDates=data.dailyLogs.filter(l=>l.tags&&l.tags.includes(tagId)).map(l=>l.date).sort();
  if(!pDates.length)return null;
  const periods=[];let cur=[pDates[0]];
  for(let i=1;i<pDates.length;i++){
    const diff=(new Date(pDates[i]+'T00:00:00')-new Date(pDates[i-1]+'T00:00:00'))/86400000;
    if(diff<=2)cur.push(pDates[i]);else{periods.push(cur);cur=[pDates[i]];}
  }
  periods.push(cur);
  const starts=periods.map(p=>p[0]);
  if(starts.length<2)return{starts,avgCycle:null,next:null};
  const gaps=[];
  for(let i=1;i<starts.length;i++)gaps.push((new Date(starts[i]+'T00:00:00')-new Date(starts[i-1]+'T00:00:00'))/86400000);
  const avg=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
  const last=new Date(starts[starts.length-1]+'T00:00:00');
  last.setDate(last.getDate()+avg);
  return{starts,avgCycle:avg,next:last.toISOString().slice(0,10)};
}

function renderPeriodInfo(info){
  const now=today();
  const rows=info.starts.slice(-4).map(s=>`<div class="tr"><span class="tr-l">经期开始</span><span class="tr-v">${s}</span></div>`).join('');
  const nextColor=info.next&&info.next<=now?'var(--r)':info.next?'var(--b)':'var(--txm)';
  return `${rows}
    ${info.avgCycle?`<div class="tr"><span class="tr-l">平均周期</span><span class="tr-v">${info.avgCycle} 天</span></div>`:''}
    ${info.next?`<div class="tr"><span class="tr-l">预测下次</span><span class="tr-v" style="color:${nextColor}">${info.next}${info.next<=now?' (已到)':''}</span></div>`:''}`;
}

function renderTagStats(tagCounts,maxCount){
  return Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).map(([tid,cnt])=>{
    const t=data.tagDefs.find(x=>x.id===parseInt(tid));if(!t)return'';
    const pct=Math.round(cnt/maxCount*100);
    return `<div class="tag-stat">
      <span style="min-width:80px;font-size:13px">${t.icon} ${esc(t.name)}</span>
      <div class="tag-bar-bg"><div class="tag-bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
      <span style="min-width:28px;text-align:right;font-size:12px;color:var(--txm)">${cnt}次</span>
    </div>`;
  }).join('');
}

// ── TAB 4: 检测 ──────────────────────────────────────────────────────
function renderLab(){
  const sorted=[...data.labResults].sort((a,b)=>b.date.localeCompare(a.date));
  const addBtn=`<button class="btn btn-s" style="width:100%;margin-bottom:11px" onclick="openAddLab()">＋ 添加检测记录</button>`;
  if(!sorted.length){document.getElementById('lab-c').innerHTML=addBtn+`<div class="empty"><div class="ei">🧪</div><p>还没有检测记录<br>添加甲状腺功能报告</p></div>`;return}
  const cards=sorted.map(lab=>{
    const vals=Object.entries(lab.values||{}).map(([k,v])=>{
      const out=v.refLow!==undefined&&(v.value<v.refLow||v.value>v.refHigh);
      return `<div class="lv${out?' out':''}"><div class="lv-n">${k}</div>
        <div class="lv-v">${v.value}<span class="lv-u"> ${v.unit||''}</span></div>
        ${v.refLow!==undefined?`<div class="lv-r">${v.refLow}–${v.refHigh}</div>`:''}</div>`;
    }).join('');
    return `<div class="lab-card"><div class="lab-hdr">
      <div><div class="lab-dt">${lab.date}</div><div class="lab-lb">${lab.lab||''}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="lab-tp">${lab.type||'检测'}</span>
        <button class="btn btn-sm btn-d" onclick="delLab(${lab.id})">✕</button>
      </div></div>
      <div class="lab-vals">${vals}</div>
      ${lab.note?`<div class="lab-note">📝 ${esc(lab.note)}</div>`:''}</div>`;
  }).join('');
  document.getElementById('lab-c').innerHTML=addBtn+cards;
}
function openAddLab(){
  const std=[{k:'TSH',u:'mIU/L',lo:.4,hi:4},{k:'FT4',u:'ng/dL',lo:.8,hi:1.8},{k:'FT3',u:'pg/mL',lo:2.3,hi:4.2},{k:'TPO-Ab',u:'IU/mL',lo:0,hi:35},{k:'Tg-Ab',u:'IU/mL',lo:0,hi:20}];
  const rows=std.map(m=>`<div class="lmr"><div class="lmn">${m.k}</div>
    <input type="number" step="any" placeholder="数值" id="lm-${m.k}" style="flex:1;padding:7px"/>
    <span style="font-size:11px;color:var(--txm);min-width:48px;text-align:right">${m.u}</span></div>`).join('');
  openModal('添加检测记录',`
    <div class="field"><label>日期</label><input type="date" id="l-dt" value="${today()}"/></div>
    <div class="field"><label>类型</label>
      <select id="l-tp"><option>甲状腺功能</option><option>抗体</option><option>全血</option><option>其他</option></select></div>
    <div class="field"><label>医院</label><input type="text" id="l-lb" placeholder="UCLA Health"/></div>
    <div class="field"><label>检测值（只填有结果的）</label>${rows}</div>
    <div class="field"><label>自定义指标</label><div id="cm"></div>
      <button class="btn btn-sm btn-s" style="margin-top:6px" onclick="addCM()">＋ 添加</button></div>
    <div class="field"><label>备注</label><textarea id="l-note" placeholder="TSH 较上次下降…"></textarea></div>
    <button class="btn btn-p" onclick="submitLab()">保存</button>`);
}
let _cmc=0;
function addCM(){
  _cmc++;const id=_cmc;
  const row=document.createElement('div');row.className='lmr';row.id=`cm-${id}`;
  row.innerHTML=`<input type="text" placeholder="名称" id="cn-${id}" style="width:70px;padding:7px"/>
    <input type="number" step="any" placeholder="数值" id="cv-${id}" style="flex:1;padding:7px"/>
    <input type="text" placeholder="单位" id="cu-${id}" style="width:52px;padding:7px"/>
    <button onclick="document.getElementById('cm-${id}').remove()" style="background:none;border:none;color:var(--r);font-size:17px;cursor:pointer">✕</button>`;
  document.getElementById('cm').appendChild(row);
}
async function submitLab(){
  const refs={TSH:{unit:'mIU/L',refLow:.4,refHigh:4},FT4:{unit:'ng/dL',refLow:.8,refHigh:1.8},
    FT3:{unit:'pg/mL',refLow:2.3,refHigh:4.2},'TPO-Ab':{unit:'IU/mL',refLow:0,refHigh:35},'Tg-Ab':{unit:'IU/mL',refLow:0,refHigh:20}};
  const vals={};
  Object.keys(refs).forEach(m=>{const el=document.getElementById('lm-'+m);if(el&&el.value!=='')vals[m]={value:parseFloat(el.value),...refs[m]}});
  document.querySelectorAll('#cm [id^="cm-"]').forEach(row=>{
    const id=row.id.replace('cm-','');
    const n=document.getElementById('cn-'+id)?.value?.trim();
    const v=document.getElementById('cv-'+id)?.value;
    const u=document.getElementById('cu-'+id)?.value?.trim();
    if(n&&v)vals[n]={value:parseFloat(v),unit:u||''};
  });
  if(!Object.keys(vals).length){toast('请至少填写一项检测值');return}
  data.labResults.push({id:data.nextLabId++,date:document.getElementById('l-dt').value,
    type:document.getElementById('l-tp').value,lab:document.getElementById('l-lb').value.trim(),
    values:vals,note:document.getElementById('l-note').value.trim()});
  await patchGist();closeModal();renderLab();renderSummary();
}
async function delLab(id){
  if(!confirm('确认删除？'))return;
  data.labResults=data.labResults.filter(l=>l.id!==id);
  await patchGist();renderLab();
}

// ── TAB 5: 补剂 ──────────────────────────────────────────────────────
function renderSupps(){
  const addBtn=`<button class="btn btn-s" style="width:100%;margin-bottom:11px" onclick="openAddSupp()">＋ 添加补剂</button>`;
  if(!data.supplements.length){document.getElementById('supps-c').innerHTML=addBtn+`<div class="empty"><div class="ei">💊</div><p>还没有补剂<br>点击上方添加</p></div>`;return}
  const cc={'处方药':'#e91e63','矿物质':'#ff9800','维生素':'#4caf50','中药':'#795548','其他':'#607d8b'};
  const rows=data.supplements.map(s=>`<div class="smi">
    <div style="width:4px;height:38px;border-radius:2px;background:${cc[s.category]||'#607d8b'};flex-shrink:0"></div>
    <div class="smi-info"><div class="smi-name">${esc(s.name)}</div>
      <div class="smi-detail">${esc(s.dose)} ${esc(s.unit)} · ${esc(s.category)}${s.note?' · '+esc(s.note):''}</div></div>
    <div class="smi-act">
      <button class="btn btn-sm btn-s" onclick="openEditSupp(${s.id})">编辑</button>
      <button class="btn btn-sm btn-d" onclick="delSupp(${s.id})">✕</button>
    </div></div>`).join('');
  document.getElementById('supps-c').innerHTML=addBtn+`<div class="card">${rows}</div>`;
}
function suppForm(s={}){
  const cats=['处方药','维生素','矿物质','中药','其他'];
  return `<div class="field"><label>名称</label><input type="text" id="sf-n" value="${esc(s.name||'')}" placeholder="左甲状腺素"/></div>
    <div class="field"><label>剂量</label><input type="text" id="sf-d" value="${esc(s.dose||'')}" placeholder="50mcg"/></div>
    <div class="field"><label>单位</label><input type="text" id="sf-u" value="${esc(s.unit||'')}" placeholder="片"/></div>
    <div class="field"><label>分类</label><select id="sf-c">${cats.map(c=>`<option ${c===s.category?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>备注（可选）</label><input type="text" id="sf-note" value="${esc(s.note||'')}" placeholder="早起空腹服用"/></div>`;
}
function openAddSupp(){openModal('添加补剂',suppForm()+`<button class="btn btn-p" onclick="submitSupp()">保存</button>`)}
function openEditSupp(id){const s=data.supplements.find(x=>x.id===id);if(!s)return;openModal('编辑补剂',suppForm(s)+`<button class="btn btn-p" onclick="submitSuppE(${id})">保存修改</button>`)}
async function submitSupp(){
  const name=document.getElementById('sf-n').value.trim();if(!name){toast('请填写名称');return}
  const ids=data.supplements.map(s=>s.id);
  data.supplements.push({id:ids.length?Math.max(...ids)+1:1,name,dose:document.getElementById('sf-d').value.trim(),
    unit:document.getElementById('sf-u').value.trim(),category:document.getElementById('sf-c').value,note:document.getElementById('sf-note').value.trim()});
  await patchGist();closeModal();renderSupps();renderToday();
}
async function submitSuppE(id){
  const s=data.supplements.find(x=>x.id===id);if(!s)return;
  const name=document.getElementById('sf-n').value.trim();if(!name){toast('请填写名称');return}
  s.name=name;s.dose=document.getElementById('sf-d').value.trim();s.unit=document.getElementById('sf-u').value.trim();
  s.category=document.getElementById('sf-c').value;s.note=document.getElementById('sf-note').value.trim();
  await patchGist();closeModal();renderSupps();renderToday();
}
async function delSupp(id){
  if(!confirm('删除后历史记录也会失效，确认？'))return;
  data.supplements=data.supplements.filter(s=>s.id!==id);
  await patchGist();renderSupps();renderToday();
}

init();
</script>
