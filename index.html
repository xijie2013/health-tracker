<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2d7d55" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="健康追踪" />
<link rel="manifest" href="manifest.json" />
<title>健康追踪</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green:       #2d7d55;
    --green-light: #e8f5ee;
    --green-mid:   #4caf7d;
    --red:         #d93025;
    --red-light:   #fdecea;
    --orange:      #e67e22;
    --orange-light:#fef3e2;
    --blue:        #1a73e8;
    --blue-light:  #e8f0fe;
    --bg:          #f0f4f1;
    --surface:     #ffffff;
    --border:      #dde5e0;
    --text:        #1e2d26;
    --text-muted:  #6b8070;
    --shadow:      0 2px 8px rgba(0,0,0,.09);
    --radius:      14px;
    --tab-h:       58px;
    --header-h:    52px;
  }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  /* Layout */
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: var(--bg); }
  header { height: var(--header-h); background: var(--green); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; flex-shrink: 0; }
  header h1 { color: #fff; font-size: 17px; font-weight: 600; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .hdr-btn { background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 18px; padding: 5px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .hdr-btn:active { background: rgba(255,255,255,.32); }
  #sync-status { width: 7px; height: 7px; border-radius: 50%; background: #8bc34a; flex-shrink: 0; }
  #sync-status.syncing { background: #ffc107; animation: pulse 1s infinite; }
  #sync-status.error { background: #f44336; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  #content { flex: 1; overflow-y: auto; padding-bottom: calc(var(--tab-h) + 4px); }

  nav { height: var(--tab-h); background: var(--surface); display: flex; border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; z-index: 100; }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: none; color: var(--text-muted); font-size: 10px; cursor: pointer; transition: color .15s; }
  .tab-btn .icon { font-size: 21px; line-height: 1; }
  .tab-btn.active { color: var(--green); }

  /* Tab Panels */
  .tab-panel { display: none; padding: 12px; }
  .tab-panel.active { display: block; }

  /* Cards */
  .card { background: var(--surface); border-radius: var(--radius); padding: 14px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: .4px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
  .card-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

  /* Form */
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=date], textarea, select {
    width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 15px; background: #fff; color: var(--text); outline: none; transition: border-color .2s; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--green); }
  textarea { resize: vertical; min-height: 64px; }
  .field { margin-bottom: 12px; }

  /* Slider */
  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  .slider-wrap input[type=range] { flex: 1; accent-color: var(--green); height: 4px; }
  .slider-val { min-width: 28px; font-size: 16px; font-weight: 700; color: var(--green); text-align: center; }

  /* === 3-option picker === */
  .tri-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .tri-btn { padding: 10px 4px; border: 2px solid var(--border); border-radius: 10px; background: #fff;
    font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; text-align: center;
    transition: all .15s; user-select: none; }
  .tri-btn:active { transform: scale(.96); }
  .tri-btn.sel-bad   { border-color: var(--red);    background: var(--red-light);    color: var(--red); }
  .tri-btn.sel-ok    { border-color: var(--orange);  background: var(--orange-light); color: var(--orange); }
  .tri-btn.sel-good  { border-color: var(--green);   background: var(--green-light);  color: var(--green); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--green); color: #fff; width: 100%; }
  .btn-secondary { background: var(--green-light); color: var(--green); }
  .btn-danger { background: var(--red-light); color: var(--red); }
  .btn-sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }

  /* Supplement checkboxes */
  .supp-list { display: flex; flex-direction: column; gap: 8px; }
  .supp-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; background: var(--bg); cursor: pointer; transition: background .12s; user-select: none; }
  .supp-item.checked { background: var(--green-light); }
  .supp-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .12s; }
  .supp-item.checked .supp-check { background: var(--green); border-color: var(--green); }
  .supp-check::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; display: none; }
  .supp-item.checked .supp-check::after { display: block; }
  .supp-info { flex: 1; min-width: 0; }
  .supp-name { font-size: 14px; font-weight: 500; }
  .supp-dose { font-size: 12px; color: var(--text-muted); }
  .supp-cat { font-size: 11px; padding: 2px 7px; border-radius: 9px; background: var(--blue-light); color: var(--blue); flex-shrink: 0; }

  /* Log list */
  .log-item { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 9px; box-shadow: var(--shadow); cursor: pointer; }
  .log-date { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .log-date small { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-left: 6px; }
  .log-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .log-tag { font-size: 12px; padding: 3px 9px; border-radius: 8px; }
  .tag-green { background: var(--green-light); color: var(--green); }
  .tag-orange { background: var(--orange-light); color: var(--orange); }
  .tag-blue { background: var(--blue-light); color: var(--blue); }

  /* Lab cards */
  .lab-card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .lab-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .lab-date { font-size: 15px; font-weight: 600; }
  .lab-lab { font-size: 12px; color: var(--text-muted); }
  .lab-type { font-size: 12px; padding: 3px 9px; border-radius: 9px; background: var(--blue-light); color: var(--blue); }
  .lab-values { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 7px; }
  .lab-val { background: var(--bg); border-radius: 9px; padding: 8px 10px; }
  .lab-val.out { background: var(--red-light); }
  .lab-val-name { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .lab-val-num { font-size: 16px; font-weight: 700; }
  .lab-val.out .lab-val-num { color: var(--red); }
  .lab-val-unit { font-size: 10px; color: var(--text-muted); }
  .lab-val-ref { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .lab-note { font-size: 13px; color: var(--text-muted); margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); }
  .lab-marker-row { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
  .lab-marker-name { font-size: 14px; font-weight: 600; min-width: 76px; }

  /* Supplement management */
  .supp-mgmt-item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .supp-mgmt-item:last-child { border-bottom: none; }
  .supp-mgmt-info { flex: 1; min-width: 0; }
  .supp-mgmt-name { font-size: 14px; font-weight: 500; }
  .supp-mgmt-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .supp-mgmt-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 22px 18px 30px; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; animation: slideUp .22s ease; }
  @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { font-size: 22px; color: var(--text-muted); background: none; border: none; cursor: pointer; }

  /* Setup screen */
  #setup-overlay { display: none; position: fixed; inset: 0; background: var(--green); z-index: 300; flex-direction: column; align-items: center; justify-content: center; padding: 32px 22px; }
  #setup-overlay.open { display: flex; }
  .setup-logo { font-size: 60px; margin-bottom: 14px; }
  .setup-title { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .setup-sub { color: rgba(255,255,255,.75); font-size: 13px; margin-bottom: 28px; text-align: center; line-height: 1.6; }
  .setup-box { background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 380px; }
  .setup-box label { color: var(--text); font-size: 14px; font-weight: 500; }
  .setup-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* Detail overlay */
  #detail-overlay { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 150; overflow-y: auto; }
  #detail-overlay.open { display: block; }
  .detail-header { position: sticky; top: 0; background: var(--green); color: #fff; padding: 13px 14px; display: flex; align-items: center; gap: 12px; z-index: 10; }
  .detail-back { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }
  .detail-header h2 { font-size: 16px; font-weight: 600; flex: 1; }
  .detail-content { padding: 14px; }

  /* Trend rows */
  .trend-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .trend-row:last-child { border-bottom: none; }
  .trend-label { color: var(--text-muted); }
  .trend-val { font-weight: 600; }

  /* Date banner — compact */
  .date-banner { background: linear-gradient(135deg, var(--green), var(--green-mid)); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  .date-big { font-size: 20px; font-weight: 700; }
  .date-sub { font-size: 12px; opacity: .8; margin-top: 1px; }
  .date-status { font-size: 12px; opacity: .9; }

  /* Empty states */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty .empty-icon { font-size: 44px; margin-bottom: 10px; }
  .empty p { font-size: 14px; line-height: 1.6; }

  /* Toast */
  #toast { position: fixed; bottom: calc(var(--tab-h) + 14px); left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 9px 18px; border-radius: 18px; font-size: 14px; z-index: 500; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  /* Scrollbar */
  #content::-webkit-scrollbar { width: 3px; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Section divider inside card */
  .card-section { padding: 10px 0; border-bottom: 1px solid var(--bg); }
  .card-section:last-child { border-bottom: none; padding-bottom: 0; }
  .card-section-label { font-size: 13px; color: var(--text-muted); margin-bottom: 7px; }

  /* Slider tick labels */
  .slider-ticks { display: flex; justify-content: space-between; padding: 2px 2px 0; }
  .slider-ticks span { font-size: 10px; color: var(--text-muted); }

  /* 2-option yes/no picker */
  .duo-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .duo-btn { padding: 9px 4px; border: 2px solid var(--border); border-radius: 10px; background: #fff;
    font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; text-align: center;
    transition: all .15s; user-select: none; }
  .duo-btn:active { transform: scale(.96); }
  .duo-btn.sel-yes { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .duo-btn.sel-no  { border-color: var(--border); background: var(--bg); color: var(--text-muted); }

  /* Weight input row */
  .weight-row { display: flex; align-items: center; gap: 8px; }
  .weight-row input { width: 90px; text-align: center; font-size: 18px; font-weight: 700; padding: 8px; }
  .weight-unit { font-size: 14px; color: var(--text-muted); font-weight: 500; }

  /* Period dot */
  .period-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e91e63; margin-right: 4px; }
</style>
</head>
<body>

<!-- Setup -->
<div id="setup-overlay">
  <div class="setup-logo">🌿</div>
  <div class="setup-title">健康追踪</div>
  <div class="setup-sub">首次使用，请配置云端数据存储<br>数据保存在你的私有 GitHub Gist</div>
  <div class="setup-box">
    <div class="field">
      <label>GitHub Gist ID</label>
      <input type="text" id="setup-gist-id" placeholder="Gist URL 最后那串 hash" />
      <div class="setup-hint">gist.github.com/xijie2013/<b>这里</b></div>
    </div>
    <div class="field">
      <label>GitHub PAT Token</label>
      <input type="text" id="setup-token" placeholder="ghp_xxxxxxxxxxxx" />
      <div class="setup-hint">Settings → Developer Settings → Personal Access Tokens（勾 gist 权限）</div>
    </div>
    <button class="btn btn-primary" onclick="saveSetup()">开始使用</button>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <header>
    <h1>🌿 健康追踪</h1>
    <div class="header-actions">
      <button class="hdr-btn" onclick="syncNow()">
        <span id="sync-status"></span>
        <span id="sync-label">同步</span>
      </button>
      <button class="hdr-btn" onclick="openSettings()" title="云端设置">⚙️</button>
    </div>
  </header>

  <div id="content">
    <div class="tab-panel active" id="panel-today"><div id="today-content"></div></div>
    <div class="tab-panel" id="panel-logs"><div id="logs-content"></div></div>
    <div class="tab-panel" id="panel-lab"><div id="lab-content"></div></div>
    <div class="tab-panel" id="panel-supps"><div id="supps-content"></div></div>
  </div>

  <nav>
    <button class="tab-btn active" onclick="switchTab('today',this)"><span class="icon">☀️</span>今日</button>
    <button class="tab-btn" onclick="switchTab('logs',this)"><span class="icon">📋</span>日志</button>
    <button class="tab-btn" onclick="switchTab('lab',this)"><span class="icon">🧪</span>检测</button>
    <button class="tab-btn" onclick="switchTab('supps',this)"><span class="icon">💊</span>补剂</button>
  </nav>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Log Detail -->
<div id="detail-overlay">
  <div class="detail-header">
    <button class="detail-back" onclick="closeDetail()">‹</button>
    <h2 id="detail-title"></h2>
    <button class="btn btn-sm btn-secondary" onclick="editCurrentDetail()">编辑</button>
  </div>
  <div class="detail-content" id="detail-content"></div>
</div>

<div id="toast"></div>

<script>
// ── Data Layer ──────────────────────────────────────────────────────
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
};

let GIST_ID = LS.get('ht_gist_id') || '';
let TOKEN   = LS.get('ht_token')   || '';
let data = null;
let currentDetailId = null;

// Sleep quality labels (stored as 1/2/3)
const SLEEP_LABELS  = { 1:'很差', 2:'一般', 3:'非常不错' };
const SLEEP_CLASSES = { 1:'sel-bad', 2:'sel-ok', 3:'sel-good' };
// Energy labels
const ENERGY_LABELS  = { 1:'萎靡', 2:'一般', 3:'充沛' };
const ENERGY_CLASSES = { 1:'sel-bad', 2:'sel-ok', 3:'sel-good' };

// ── Setup ───────────────────────────────────────────────────────────
function needsSetup() { return !GIST_ID || !TOKEN; }

function saveSetup() {
  const gid = document.getElementById('setup-gist-id').value.trim();
  const tok = document.getElementById('setup-token').value.trim();
  if (!gid || !tok) { alert('请填写 Gist ID 和 Token'); return; }
  GIST_ID = gid; TOKEN = tok;
  LS.set('ht_gist_id', GIST_ID);
  LS.set('ht_token', TOKEN);
  document.getElementById('setup-overlay').classList.remove('open');
  init();
}

function openSettings() {
  openModal('云端同步设置', `
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">修改后立即生效，重新拉取数据。</p>
    <div class="field"><label>GitHub Gist ID</label>
      <input type="text" id="s-gid" value="${escHtml(GIST_ID)}" placeholder="Gist hash" />
    </div>
    <div class="field"><label>GitHub PAT Token</label>
      <input type="text" id="s-tok" value="${escHtml(TOKEN)}" placeholder="ghp_xxxx" />
      <div class="setup-hint">如果 token 过期或 regenerate 了，在这里更新</div>
    </div>
    <button class="btn btn-primary" onclick="applySettings()">保存并重新同步</button>
  `);
}

async function applySettings() {
  const gid = document.getElementById('s-gid').value.trim();
  const tok = document.getElementById('s-tok').value.trim();
  if (!gid || !tok) { toast('请填写完整'); return; }
  GIST_ID = gid; TOKEN = tok;
  LS.set('ht_gist_id', GIST_ID);
  LS.set('ht_token', TOKEN);
  closeModal();
  await fetchGist();
  renderAll();
  toast('✅ 设置已更新');
}

// ── Gist API ────────────────────────────────────────────────────────
async function fetchGist() {
  setSyncStatus('syncing');
  try {
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { 'Authorization': `token ${TOKEN}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const gist = await r.json();
    const content = gist.files['health-data.json']?.content;
    if (!content) throw new Error('health-data.json 不存在');
    data = JSON.parse(content);
    LS.set('ht_cache', data);
    setSyncStatus('ok');
    return true;
  } catch(e) {
    setSyncStatus('error');
    const cached = LS.get('ht_cache');
    if (cached) { data = cached; toast('⚠️ 离线模式（使用缓存）'); return true; }
    toast('❌ ' + e.message);
    return false;
  }
}

async function patchGist() {
  setSyncStatus('syncing');
  data.exportedAt = new Date().toISOString();
  try {
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${TOKEN}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { 'health-data.json': { content: JSON.stringify(data, null, 2) } } })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    LS.set('ht_cache', data);
    setSyncStatus('ok');
    toast('✅ 已保存');
    return true;
  } catch(e) {
    setSyncStatus('error');
    toast('❌ 保存失败：' + e.message);
    return false;
  }
}

function setSyncStatus(s) {
  document.getElementById('sync-status').className = s;
  document.getElementById('sync-label').textContent = s === 'syncing' ? '同步中' : s === 'error' ? '失败' : '已同步';
}

async function syncNow() { await fetchGist(); renderAll(); }

// ── Init ─────────────────────────────────────────────────────────────
async function init() {
  if (needsSetup()) { document.getElementById('setup-overlay').classList.add('open'); return; }
  const ok = await fetchGist();
  if (!ok) return;
  if (!data) data = emptyData();
  renderAll();
}

function emptyData() {
  return { version:1, exportedAt: new Date().toISOString(), nextLogId:1, nextLabId:1, supplements:[], dailyLogs:[], labResults:[] };
}

function renderAll() { renderToday(); renderLogs(); renderLab(); renderSupps(); }

// ── Helpers ──────────────────────────────────────────────────────────
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return `${d.slice(5).replace('-','/')} 周${'日一二三四五六'[dt.getDay()]}`;
}
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function suppCompletionRate(log) {
  if (!data.supplements.length) return null;
  const taken = data.supplements.filter(s => log.supplements?.[s.id]).length;
  return Math.round(taken / data.supplements.length * 100);
}
function toast(msg, dur=2400) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), dur);
}
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}
function openModal(title, html) {
  document.getElementById('modal-title-text').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

// ── TAB 1 — 今日 ─────────────────────────────────────────────────────
function renderToday() {
  const todayStr = today();
  let log = data.dailyLogs.find(l => l.date === todayStr);
  if (!log) {
    log = { id: data.nextLogId++, date: todayStr,
      sleep: { hoursSlept: 7, quality: 0 },
      energy: { level: 0 },
      weight: null,
      period: null,
      fasting16: null,
      exercise: null,
      supplements: {} };
    data.dailyLogs.push(log);
  }
  // backfill missing fields for old logs
  if (log.period   === undefined) log.period   = null;
  if (log.fasting16=== undefined) log.fasting16= null;
  if (log.exercise === undefined) log.exercise = null;
  if (log.weight   === undefined) log.weight   = null;

  const dt = new Date();
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  const recorded = log.sleep.quality > 0 && log.energy.level > 0;

  // Sleep quality buttons
  const sqBtns = [1,2,3].map(v => {
    const sel = log.sleep.quality === v ? SLEEP_CLASSES[v] : '';
    return `<button class="tri-btn ${sel}" onclick="setTri('sleep-q',${v},'sleep.quality')">${SLEEP_LABELS[v]}</button>`;
  }).join('');

  // Energy buttons
  const enBtns = [1,2,3].map(v => {
    const sel = log.energy.level === v ? ENERGY_CLASSES[v] : '';
    return `<button class="tri-btn ${sel}" onclick="setTri('energy-l',${v},'energy.level')">${ENERGY_LABELS[v]}</button>`;
  }).join('');

  // Supplements
  const suppRows = data.supplements.map(s => {
    const checked = log.supplements?.[s.id];
    return `<div class="supp-item ${checked ? 'checked' : ''}" onclick="toggleSupp(${s.id}, this)">
      <div class="supp-check"></div>
      <div class="supp-info">
        <div class="supp-name">${escHtml(s.name)}</div>
        <div class="supp-dose">${escHtml(s.dose)} ${escHtml(s.unit)}</div>
      </div>
      <span class="supp-cat">${escHtml(s.category)}</span>
    </div>`;
  }).join('') || `<p style="color:var(--text-muted);font-size:13px;">还没有补剂 → 去「补剂」标签添加</p>`;

  // yes/no button builders
  function duoBtns(groupId, field, val) {
    const ysel = val === true  ? 'sel-yes' : '';
    const nsel = val === false ? 'sel-no'  : '';
    return `<div class="duo-group" id="${groupId}">
      <button class="duo-btn ${ysel}" onclick="setDuo('${groupId}',true,'${field}')">✓ 是</button>
      <button class="duo-btn ${nsel}" onclick="setDuo('${groupId}',false,'${field}')">✗ 否</button>
    </div>`;
  }

  document.getElementById('today-content').innerHTML = `
    <div class="date-banner">
      <div>
        <div class="date-big">${months[dt.getMonth()]} ${dt.getDate()}日</div>
        <div class="date-sub">${dt.getFullYear()} · ${days[dt.getDay()]}</div>
      </div>
      <div class="date-status">${recorded ? '已记录 ✓' : '待打卡'}</div>
    </div>

    <div class="card">
      <div class="card-section">
        <div class="card-title"><span class="dot"></span>睡眠时长</div>
        <div class="slider-wrap">
          <input type="range" min="0" max="12" step="0.5" value="${log.sleep.hoursSlept}"
            oninput="updateSlider(this,'sl-val'); setField('sleep.hoursSlept', parseFloat(this.value))" />
          <span class="slider-val" id="sl-val">${log.sleep.hoursSlept}h</span>
        </div>
        <div class="slider-ticks">
          <span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span><span>12</span>
        </div>
      </div>
      <div class="card-section">
        <div class="card-title"><span class="dot"></span>睡眠质量</div>
        <div class="tri-group" id="sleep-q">${sqBtns}</div>
      </div>
      <div class="card-section">
        <div class="card-title"><span class="dot" style="background:var(--orange)"></span>今日精力</div>
        <div class="tri-group" id="energy-l">${enBtns}</div>
      </div>
      <div class="card-section">
        <div class="card-title"><span class="dot" style="background:#9c27b0"></span>体重</div>
        <div class="weight-row">
          <input type="number" step="0.1" min="30" max="200" placeholder="—"
            value="${log.weight !== null ? log.weight : ''}"
            oninput="setField('weight', this.value ? parseFloat(this.value) : null)" />
          <span class="weight-unit">kg</span>
        </div>
      </div>
      <div class="card-section">
        <div class="card-title"><span class="period-dot"></span>今日经期</div>
        ${duoBtns('period-g', 'period', log.period)}
      </div>
      <div class="card-section">
        <div class="card-title"><span class="dot" style="background:var(--blue)"></span>16:8 轻断食</div>
        ${duoBtns('fasting-g', 'fasting16', log.fasting16)}
      </div>
      <div class="card-section">
        <div class="card-title"><span class="dot" style="background:var(--orange)"></span>运动 ≥ 10 分钟</div>
        ${duoBtns('exercise-g', 'exercise', log.exercise)}
      </div>
    </div>

    ${data.supplements.length ? `
    <div class="card">
      <div class="card-title"><span class="dot" style="background:var(--blue)"></span>今日补剂</div>
      <div class="supp-list">${suppRows}</div>
    </div>` : `<div class="card"><div class="supp-list">${suppRows}</div></div>`}

    <button class="btn btn-primary" onclick="saveToday()">💾 保存今日记录</button>
  `;
}

function updateSlider(el, valId) {
  document.getElementById(valId).textContent = el.value + 'h';
}

function setTri(groupId, val, field) {
  const container = document.getElementById(groupId);
  if (!container) return;
  const isEnergy = field.startsWith('energy');
  const classes = isEnergy ? ENERGY_CLASSES : SLEEP_CLASSES;
  container.querySelectorAll('.tri-btn').forEach((btn, i) => {
    const v = i + 1;
    btn.className = 'tri-btn' + (v === val ? ' ' + classes[v] : '');
  });
  setField(field, val);
}

function setField(field, val) {
  const todayStr = today();
  const log = data.dailyLogs.find(l => l.date === todayStr);
  if (!log) return;
  const parts = field.split('.');
  if (parts.length === 2) log[parts[0]][parts[1]] = val;
  else log[field] = val;
}

function setDuo(groupId, val, field) {
  const container = document.getElementById(groupId);
  if (!container) return;
  container.querySelectorAll('.duo-btn').forEach(btn => {
    btn.className = 'duo-btn';
  });
  const [yBtn, nBtn] = container.querySelectorAll('.duo-btn');
  if (val === true)  yBtn.classList.add('sel-yes');
  if (val === false) nBtn.classList.add('sel-no');
  setField(field, val);
}

function toggleSupp(id, el) {
  const log = data.dailyLogs.find(l => l.date === today());
  if (!log) return;
  if (!log.supplements) log.supplements = {};
  log.supplements[id] = !log.supplements[id];
  el.classList.toggle('checked', log.supplements[id]);
}

async function saveToday() {
  const log = data.dailyLogs.find(l => l.date === today());
  if (log && (log.sleep.quality === 0 || log.energy.level === 0)) {
    toast('请选择睡眠质量和精力状态');
    return;
  }
  await patchGist();
  renderToday();
}

// ── TAB 2 — 日志历史 ──────────────────────────────────────────────────
function renderLogs() {
  const sorted = [...data.dailyLogs].sort((a,b) => b.date.localeCompare(a.date));
  if (!sorted.length) {
    document.getElementById('logs-content').innerHTML = `<div class="empty"><div class="empty-icon">📋</div><p>还没有日志<br>在「今日」打卡后会出现在这里</p></div>`;
    return;
  }
  const html = sorted.map(log => {
    const sq = log.sleep.quality;
    const en = log.energy.level;
    const rate = suppCompletionRate(log);
    const sqLabel = sq ? SLEEP_LABELS[sq] || sq : '—';
    const enLabel = en ? ENERGY_LABELS[en] || en : '—';
    const weightTag = log.weight ? `<span class="log-tag" style="background:#f3e5f5;color:#7b1fa2;">⚖️ ${log.weight}kg</span>` : '';
    const exTag = log.exercise === true ? `<span class="log-tag tag-orange">🏃 运动</span>` : '';
    const periodTag = log.period === true ? `<span class="log-tag" style="background:#fce4ec;color:#c2185b;">🔴 经期</span>` : '';
    return `<div class="log-item" onclick="openLogDetail(${log.id})">
      <div class="log-date">${fmtDate(log.date)}<small>${log.date}</small></div>
      <div class="log-meta">
        <span class="log-tag tag-green">🌙 ${log.sleep.hoursSlept}h · ${sqLabel}</span>
        <span class="log-tag tag-orange">⚡ ${enLabel}</span>
        ${rate !== null ? `<span class="log-tag tag-blue">💊 ${rate}%</span>` : ''}
        ${weightTag}${exTag}${periodTag}
      </div>
    </div>`;
  }).join('');
  document.getElementById('logs-content').innerHTML = html;
}

function openLogDetail(id) {
  const log = data.dailyLogs.find(l => l.id === id);
  if (!log) return;
  currentDetailId = id;
  document.getElementById('detail-title').textContent = log.date;

  const suppRows = data.supplements.map(s => {
    const taken = log.supplements?.[s.id];
    return `<div class="trend-row"><span class="trend-label">${escHtml(s.name)}</span>
      <span class="trend-val" style="color:${taken?'var(--green)':'var(--text-muted)'}">${taken?'✓ 已服':'✗ 未服'}</span></div>`;
  }).join('') || '<p style="font-size:13px;color:var(--text-muted);">无补剂记录</p>';

  const sq = log.sleep.quality;
  const en = log.energy.level;
  const boolStr = v => v === true ? '✓ 是' : v === false ? '✗ 否' : '未记录';

  document.getElementById('detail-content').innerHTML = `
    <div class="card">
      <div class="card-title"><span class="dot"></span>睡眠</div>
      <div class="trend-row"><span class="trend-label">时长</span><span class="trend-val">${log.sleep.hoursSlept} 小时</span></div>
      <div class="trend-row"><span class="trend-label">质量</span><span class="trend-val">${sq ? SLEEP_LABELS[sq]||sq : '未记录'}</span></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot" style="background:var(--orange)"></span>精力</div>
      <div class="trend-row"><span class="trend-label">状态</span><span class="trend-val">${en ? ENERGY_LABELS[en]||en : '未记录'}</span></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot" style="background:#9c27b0"></span>身体</div>
      ${log.weight !== null && log.weight !== undefined ? `<div class="trend-row"><span class="trend-label">体重</span><span class="trend-val">${log.weight} kg</span></div>` : ''}
      <div class="trend-row"><span class="trend-label">经期</span><span class="trend-val" style="color:${log.period?'#e91e63':'var(--text-muted)'}">${boolStr(log.period)}</span></div>
      <div class="trend-row"><span class="trend-label">16:8 断食</span><span class="trend-val" style="color:${log.fasting16?'var(--green)':'var(--text-muted)'}">${boolStr(log.fasting16)}</span></div>
      <div class="trend-row"><span class="trend-label">运动 ≥ 10min</span><span class="trend-val" style="color:${log.exercise?'var(--green)':'var(--text-muted)'}">${boolStr(log.exercise)}</span></div>
    </div>
    ${data.supplements.length ? `<div class="card">
      <div class="card-title"><span class="dot" style="background:var(--blue)"></span>补剂</div>
      ${suppRows}
    </div>` : ''}
    <button class="btn btn-danger" style="width:100%;margin-top:6px;" onclick="deleteLog(${log.id})">🗑 删除此记录</button>
  `;
  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  currentDetailId = null;
}

function editCurrentDetail() {
  if (!currentDetailId) return;
  const log = data.dailyLogs.find(l => l.id === currentDetailId);
  if (!log) return;
  closeDetail();
  openLogEditModal(log);
}

function openLogEditModal(log) {
  const sqBtns = [1,2,3].map(v => {
    const sel = log.sleep.quality === v ? SLEEP_CLASSES[v] : '';
    return `<button class="tri-btn ${sel}" onclick="setTriLog(${log.id},'edit-sq',${v},'sleep.quality')">${SLEEP_LABELS[v]}</button>`;
  }).join('');
  const enBtns = [1,2,3].map(v => {
    const sel = log.energy.level === v ? ENERGY_CLASSES[v] : '';
    return `<button class="tri-btn ${sel}" onclick="setTriLog(${log.id},'edit-en',${v},'energy.level')">${ENERGY_LABELS[v]}</button>`;
  }).join('');
  const suppRows = data.supplements.map(s => {
    const checked = log.supplements?.[s.id];
    return `<div class="supp-item ${checked?'checked':''}" onclick="toggleSuppInModal(${s.id},${log.id},this)">
      <div class="supp-check"></div>
      <div class="supp-info"><div class="supp-name">${escHtml(s.name)}</div><div class="supp-dose">${escHtml(s.dose)}</div></div>
    </div>`;
  }).join('');

  openModal(`编辑 · ${log.date}`, `
    <div class="field"><label>睡眠时长</label>
      <div class="slider-wrap">
        <input type="range" min="0" max="12" step="0.5" value="${log.sleep.hoursSlept}" id="edit-sl"
          oninput="updateSliderEdit(this,'edit-sl-v'); updateLogField(${log.id},'sleep.hoursSlept',parseFloat(this.value))" />
        <span class="slider-val" id="edit-sl-v">${log.sleep.hoursSlept}h</span>
      </div>
    </div>
    <div class="field"><label>睡眠质量</label><div class="tri-group" id="edit-sq">${sqBtns}</div></div>
    <div class="field"><label>精力</label><div class="tri-group" id="edit-en">${enBtns}</div></div>
    ${suppRows ? `<div class="field"><label>补剂</label><div class="supp-list">${suppRows}</div></div>` : ''}
    <button class="btn btn-primary" onclick="saveLogEdit(${log.id})">保存修改</button>
  `);
}

function updateSliderEdit(el, valId) {
  document.getElementById(valId).textContent = el.value + 'h';
}

function setTriLog(logId, groupId, val, field) {
  const container = document.getElementById(groupId);
  if (!container) return;
  const isEnergy = field.startsWith('energy');
  const classes = isEnergy ? ENERGY_CLASSES : SLEEP_CLASSES;
  container.querySelectorAll('.tri-btn').forEach((btn, i) => {
    btn.className = 'tri-btn' + (i+1 === val ? ' ' + classes[i+1] : '');
  });
  updateLogField(logId, field, val);
}

function updateLogField(id, field, val) {
  const log = data.dailyLogs.find(l => l.id === id);
  if (!log) return;
  const parts = field.split('.');
  if (parts.length === 2) log[parts[0]][parts[1]] = val;
  else log[field] = val;
}

function toggleSuppInModal(suppId, logId, el) {
  const log = data.dailyLogs.find(l => l.id === logId);
  if (!log) return;
  if (!log.supplements) log.supplements = {};
  log.supplements[suppId] = !log.supplements[suppId];
  el.classList.toggle('checked', log.supplements[suppId]);
}

async function saveLogEdit(id) {
  await patchGist(); closeModal(); renderLogs(); renderToday();
}

async function deleteLog(id) {
  if (!confirm('确认删除这条日志？')) return;
  data.dailyLogs = data.dailyLogs.filter(l => l.id !== id);
  await patchGist(); closeDetail(); renderLogs(); renderToday();
}

// ── TAB 3 — 检测 ─────────────────────────────────────────────────────
function renderLab() {
  const sorted = [...data.labResults].sort((a,b) => b.date.localeCompare(a.date));
  const addBtn = `<button class="btn btn-secondary" style="width:100%;margin-bottom:12px;" onclick="openAddLab()">＋ 添加检测记录</button>`;
  if (!sorted.length) {
    document.getElementById('lab-content').innerHTML = addBtn + `<div class="empty"><div class="empty-icon">🧪</div><p>还没有检测记录<br>添加你的甲状腺功能报告</p></div>`;
    return;
  }
  const cards = sorted.map(lab => {
    const vals = Object.entries(lab.values||{}).map(([k,v]) => {
      const out = v.refLow !== undefined && (v.value < v.refLow || v.value > v.refHigh);
      return `<div class="lab-val ${out?'out':''}">
        <div class="lab-val-name">${k}</div>
        <div class="lab-val-num">${v.value}<span class="lab-val-unit"> ${v.unit||''}</span></div>
        ${v.refLow !== undefined ? `<div class="lab-val-ref">${v.refLow}–${v.refHigh}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="lab-card">
      <div class="lab-header">
        <div><div class="lab-date">${lab.date}</div><div class="lab-lab">${lab.lab||''}</div></div>
        <div style="display:flex;gap:6px;align-items:center;">
          <span class="lab-type">${lab.type||'检测'}</span>
          <button class="btn btn-sm btn-danger" onclick="deleteLab(${lab.id})">✕</button>
        </div>
      </div>
      <div class="lab-values">${vals}</div>
      ${lab.note ? `<div class="lab-note">📝 ${escHtml(lab.note)}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('lab-content').innerHTML = addBtn + cards;
}

function openAddLab() {
  const std = [
    {key:'TSH',    unit:'mIU/L', lo:0.4, hi:4.0},
    {key:'FT4',    unit:'ng/dL', lo:0.8, hi:1.8},
    {key:'FT3',    unit:'pg/mL', lo:2.3, hi:4.2},
    {key:'TPO-Ab', unit:'IU/mL', lo:0,   hi:35 },
    {key:'Tg-Ab',  unit:'IU/mL', lo:0,   hi:20 },
  ];
  const rows = std.map(m => `<div class="lab-marker-row">
    <div class="lab-marker-name">${m.key}</div>
    <input type="number" step="any" placeholder="数值" id="lab-m-${m.key}" style="flex:1;min-width:0;padding:8px;" />
    <span style="font-size:12px;color:var(--text-muted);min-width:52px;text-align:right;">${m.unit}</span>
  </div>`).join('');

  openModal('添加检测记录', `
    <div class="field"><label>日期</label><input type="date" id="lab-date" value="${today()}" /></div>
    <div class="field"><label>类型</label>
      <select id="lab-type"><option>甲状腺功能</option><option>抗体</option><option>全血</option><option>其他</option></select>
    </div>
    <div class="field"><label>医院</label><input type="text" id="lab-lab" placeholder="UCLA Health" /></div>
    <div class="field"><label>检测值（只填有结果的）</label>${rows}</div>
    <div class="field" id="cm-wrap"><label>自定义指标</label>
      <div id="custom-markers"></div>
      <button class="btn btn-sm btn-secondary" style="margin-top:7px;" onclick="addCustomMarker()">＋ 添加</button>
    </div>
    <div class="field"><label>备注</label><textarea id="lab-note" placeholder="TSH 较上次下降…"></textarea></div>
    <button class="btn btn-primary" onclick="submitLab()">保存</button>
  `);
}

let cmCount = 0;
function addCustomMarker() {
  cmCount++;
  const id = cmCount;
  const row = document.createElement('div');
  row.className = 'lab-marker-row'; row.id = `cm-${id}`;
  row.innerHTML = `
    <input type="text" placeholder="名称" id="cm-n-${id}" style="width:76px;padding:8px;" />
    <input type="number" step="any" placeholder="数值" id="cm-v-${id}" style="flex:1;padding:8px;" />
    <input type="text" placeholder="单位" id="cm-u-${id}" style="width:56px;padding:8px;" />
    <button onclick="document.getElementById('cm-${id}').remove()" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;">✕</button>`;
  document.getElementById('custom-markers').appendChild(row);
}

async function submitLab() {
  const refs = { TSH:{unit:'mIU/L',refLow:0.4,refHigh:4.0}, FT4:{unit:'ng/dL',refLow:0.8,refHigh:1.8},
    FT3:{unit:'pg/mL',refLow:2.3,refHigh:4.2}, 'TPO-Ab':{unit:'IU/mL',refLow:0,refHigh:35}, 'Tg-Ab':{unit:'IU/mL',refLow:0,refHigh:20} };
  const values = {};
  Object.keys(refs).forEach(m => {
    const el = document.getElementById('lab-m-' + m);
    if (el && el.value !== '') values[m] = { value: parseFloat(el.value), ...refs[m] };
  });
  document.querySelectorAll('[id^="cm-"]:not(#cm-wrap):not(#custom-markers)').forEach(row => {
    const id = row.id.replace('cm-','');
    const n = document.getElementById('cm-n-'+id)?.value?.trim();
    const v = document.getElementById('cm-v-'+id)?.value;
    const u = document.getElementById('cm-u-'+id)?.value?.trim();
    if (n && v) values[n] = { value: parseFloat(v), unit: u||'' };
  });
  if (!Object.keys(values).length) { toast('请至少填写一项检测值'); return; }
  data.labResults.push({ id: data.nextLabId++, date: document.getElementById('lab-date').value,
    type: document.getElementById('lab-type').value, lab: document.getElementById('lab-lab').value.trim(),
    values, note: document.getElementById('lab-note').value.trim() });
  await patchGist(); closeModal(); renderLab();
}

async function deleteLab(id) {
  if (!confirm('确认删除此检测记录？')) return;
  data.labResults = data.labResults.filter(l => l.id !== id);
  await patchGist(); renderLab();
}

// ── TAB 4 — 补剂 ─────────────────────────────────────────────────────
function renderSupps() {
  const addBtn = `<button class="btn btn-secondary" style="width:100%;margin-bottom:12px;" onclick="openAddSupp()">＋ 添加补剂</button>`;
  if (!data.supplements.length) {
    document.getElementById('supps-content').innerHTML = addBtn + `<div class="empty"><div class="empty-icon">💊</div><p>还没有补剂<br>点击上方添加</p></div>`;
    return;
  }
  const catColor = {'处方药':'#e91e63','矿物质':'#ff9800','维生素':'#4caf50','中药':'#795548','其他':'#607d8b'};
  const rows = data.supplements.map(s => `<div class="supp-mgmt-item">
    <div style="width:4px;height:40px;border-radius:2px;background:${catColor[s.category]||'#607d8b'};flex-shrink:0;"></div>
    <div class="supp-mgmt-info">
      <div class="supp-mgmt-name">${escHtml(s.name)}</div>
      <div class="supp-mgmt-detail">${escHtml(s.dose)} ${escHtml(s.unit)} · ${escHtml(s.category)}${s.note?' · '+escHtml(s.note):''}</div>
    </div>
    <div class="supp-mgmt-actions">
      <button class="btn btn-sm btn-secondary" onclick="openEditSupp(${s.id})">编辑</button>
      <button class="btn btn-sm btn-danger" onclick="deleteSupp(${s.id})">✕</button>
    </div>
  </div>`).join('');
  document.getElementById('supps-content').innerHTML = addBtn + `<div class="card">${rows}</div>`;
}

function suppFormHtml(s={}) {
  const cats = ['处方药','维生素','矿物质','中药','其他'];
  return `
    <div class="field"><label>名称</label><input type="text" id="sf-name" value="${escHtml(s.name||'')}" placeholder="左甲状腺素" /></div>
    <div class="field"><label>剂量</label><input type="text" id="sf-dose" value="${escHtml(s.dose||'')}" placeholder="50mcg" /></div>
    <div class="field"><label>单位</label><input type="text" id="sf-unit" value="${escHtml(s.unit||'')}" placeholder="片" /></div>
    <div class="field"><label>分类</label>
      <select id="sf-cat">${cats.map(c=>`<option ${c===s.category?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="field"><label>备注（可选）</label><input type="text" id="sf-note" value="${escHtml(s.note||'')}" placeholder="早起空腹服用" /></div>`;
}

function openAddSupp() { openModal('添加补剂', suppFormHtml() + `<button class="btn btn-primary" onclick="submitSupp()">保存</button>`); }
function openEditSupp(id) {
  const s = data.supplements.find(x=>x.id===id);
  if (!s) return;
  openModal('编辑补剂', suppFormHtml(s) + `<button class="btn btn-primary" onclick="submitSuppEdit(${id})">保存修改</button>`);
}

async function submitSupp() {
  const name = document.getElementById('sf-name').value.trim();
  if (!name) { toast('请填写名称'); return; }
  const ids = data.supplements.map(s=>s.id);
  data.supplements.push({ id: ids.length ? Math.max(...ids)+1 : 1, name,
    dose: document.getElementById('sf-dose').value.trim(),
    unit: document.getElementById('sf-unit').value.trim(),
    category: document.getElementById('sf-cat').value,
    note: document.getElementById('sf-note').value.trim() });
  await patchGist(); closeModal(); renderSupps(); renderToday();
}

async function submitSuppEdit(id) {
  const s = data.supplements.find(x=>x.id===id);
  if (!s) return;
  const name = document.getElementById('sf-name').value.trim();
  if (!name) { toast('请填写名称'); return; }
  s.name=name; s.dose=document.getElementById('sf-dose').value.trim();
  s.unit=document.getElementById('sf-unit').value.trim();
  s.category=document.getElementById('sf-cat').value;
  s.note=document.getElementById('sf-note').value.trim();
  await patchGist(); closeModal(); renderSupps(); renderToday();
}

async function deleteSupp(id) {
  if (!confirm('删除后历史记录中此补剂也会失效，确认？')) return;
  data.supplements = data.supplements.filter(s=>s.id!==id);
  await patchGist(); renderSupps(); renderToday();
}

// ── Start ────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
